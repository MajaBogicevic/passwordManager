services:
  postgres:
    image: postgres:16
    container_name: passwordman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: passwordman
      POSTGRES_USER: passwordman
      POSTGRES_PASSWORD: passwordman
    ports:
      - "55433:5432"
    volumes:
      - passwordman_postgres_data:/var/lib/postgresql/data

volumes:
  passwordman_postgres_data: